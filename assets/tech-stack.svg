<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="stackBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.04)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.01)" />
    </linearGradient>

    <linearGradient id="panelBorderCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="panelBorderPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="panelBorderGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="panelBorderAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.1" />
    </linearGradient>

    <!-- Tag Styles -->
    <linearGradient id="tagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.07)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="glowSubtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Base Canvas -->
  <rect width="1100" height="360" rx="14" fill="url(#stackBg)" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1" />

  <!-- Section Title -->
  <g transform="translate(36, 40)">
    <text x="0" y="0" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.5">ENGINEERING DOMAINS &amp; PRODUCTION STACK</text>
    <text x="0" y="24" fill="#E2E8F0" class="font-sans" font-size="19" font-weight="700">Focused, Battle-Tested Technologies Shipped in Real Applications</text>
  </g>

  <!-- 4 Main Focus Cards -->
  <!-- Col 1: Web & Distributed Backend -->
  <g transform="translate(36, 92)">
    <rect width="245" height="236" rx="10" fill="url(#panelGrad)" stroke="url(#panelBorderCyan)" stroke-width="1.2" />
    <circle cx="24" cy="28" r="4" fill="#38BDF8" filter="url(#glowSubtle)" />
    <text x="38" y="32" fill="#38BDF8" class="font-mono" font-size="12" font-weight="700">FULL-STACK &amp; WEB</text>

    <!-- Tags -->
    <!-- Tag 1 -->
    <rect x="18" y="52" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="68" y="69" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">React.js</text>

    <rect x="126" y="52" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="176" y="69" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Next.js</text>

    <!-- Tag 2 -->
    <rect x="18" y="86" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="68" y="103" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">TypeScript</text>

    <rect x="126" y="86" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="176" y="103" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Node.js</text>

    <!-- Tag 3 -->
    <rect x="18" y="120" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="68" y="137" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Express.js</text>

    <rect x="126" y="120" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="176" y="137" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">MongoDB</text>

    <!-- Tag 4 -->
    <rect x="18" y="154" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
    <text x="122" y="171" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Tailwind CSS &amp; REST APIs</text>

    <text x="18" y="210" fill="#64748B" class="font-mono" font-size="10">Projects: College Campus, WEARSUPER</text>
  </g>

  <!-- Col 2: Mobile & Living Room TV -->
  <g transform="translate(297, 92)">
    <rect width="245" height="236" rx="10" fill="url(#panelGrad)" stroke="url(#panelBorderPurple)" stroke-width="1.2" />
    <circle cx="24" cy="28" r="4" fill="#A78BFA" filter="url(#glowSubtle)" />
    <text x="38" y="32" fill="#A78BFA" class="font-mono" font-size="12" font-weight="700">MOBILE &amp; LIVING ROOM</text>

    <!-- Tags -->
    <rect x="18" y="52" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1" />
    <text x="68" y="69" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Flutter</text>

    <rect x="126" y="52" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1" />
    <text x="176" y="69" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Dart</text>

    <rect x="18" y="86" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1" />
    <text x="122" y="103" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">React Native for TV</text>

    <rect x="18" y="120" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1" />
    <text x="68" y="137" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Android SDK</text>

    <rect x="126" y="120" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1" />
    <text x="176" y="137" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Firebase</text>

    <rect x="18" y="154" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(167, 139, 250, 0.2)" stroke-width="1" />
    <text x="122" y="171" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Google Maps Platform SDK</text>

    <text x="18" y="210" fill="#64748B" class="font-mono" font-size="10">Projects: Rescuen (Play Store), Storyloom</text>
  </g>

  <!-- Col 3: Systems, Cloud & Tools -->
  <g transform="translate(558, 92)">
    <rect width="245" height="236" rx="10" fill="url(#panelGrad)" stroke="url(#panelBorderGreen)" stroke-width="1.2" />
    <circle cx="24" cy="28" r="4" fill="#34D399" filter="url(#glowSubtle)" />
    <text x="38" y="32" fill="#34D399" class="font-mono" font-size="12" font-weight="700">CLOUD &amp; SYSTEMS</text>

    <!-- Tags -->
    <rect x="18" y="52" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
    <text x="68" y="69" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Docker</text>

    <rect x="126" y="52" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
    <text x="176" y="69" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Linux (Ubuntu)</text>

    <rect x="18" y="86" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
    <text x="68" y="103" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Git &amp; GitHub</text>

    <rect x="126" y="86" width="100" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
    <text x="176" y="103" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Postman</text>

    <rect x="18" y="120" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
    <text x="122" y="137" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">AWS Bedrock &amp; Polly</text>

    <rect x="18" y="154" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1" />
    <text x="122" y="171" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">CI/CD &amp; Microservices</text>

    <text x="18" y="210" fill="#64748B" class="font-mono" font-size="10">Certified: OCI GenAI, Azure AZ-900</text>
  </g>

  <!-- Col 4: Specialized Engineering R&D -->
  <g transform="translate(819, 92)">
    <rect width="245" height="236" rx="10" fill="url(#panelGrad)" stroke="url(#panelBorderAmber)" stroke-width="1.2" />
    <circle cx="24" cy="28" r="4" fill="#FBBF24" filter="url(#glowSubtle)" />
    <text x="38" y="32" fill="#FBBF24" class="font-mono" font-size="12" font-weight="700">SPECIALIZED R&amp;D</text>

    <!-- Tags -->
    <rect x="18" y="52" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1" />
    <text x="122" y="69" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">StrongBox / TEE Crypto</text>

    <rect x="18" y="86" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1" />
    <text x="122" y="103" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">BLE / NFC Offline Protocols</text>

    <rect x="18" y="120" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1" />
    <text x="122" y="137" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Computer Vision (OpenCV)</text>

    <rect x="18" y="154" width="208" height="26" rx="6" fill="url(#tagBg)" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1" />
    <text x="122" y="171" fill="#F1F5F9" class="font-sans" font-size="11" font-weight="500" text-anchor="middle">Multi-Agent AI &amp; LangChain</text>

    <text x="18" y="210" fill="#64748B" class="font-mono" font-size="10">Projects: Fortress UPI, Face Mask CV</text>
  </g>
</svg>
