  <rect x="10.5" y="10.5" width="409" height="229" fill="none" stroke="#D4AF37" stroke-opacity=".45"/>
  <path d="M6 26V6h20M404 6h20v20M6 224v20h20M404 244h20v-20" fill="none" stroke="#D4AF37" stroke-width="2"/>
  <text x="32" y="46" fill="#D4AF37" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" letter-spacing="2.2" text-anchor="start">QUOTE OF THE DAY</text>
  <text x="396" y="92" fill="url(#gold)" fill-opacity=".35" font-family="Georgia,'Times New Roman',serif" font-size="96" text-anchor="end">&#8221;</text>
  <text x="32" y="104" fill="#EFE8D6" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19">Walking on water and developing</text>
  <text x="32" y="132" fill="#EFE8D6" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19">software from a specification are</text>
  <text x="32" y="160" fill="#EFE8D6" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="19">easy if both are frozen.</text>
