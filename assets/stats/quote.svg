  <text x="66" y="200" fill="#D4AF37" font-family="'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="2" text-anchor="start">EDWARD V. BERARD</text>
