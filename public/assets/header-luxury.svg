<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="45%" stop-color="#090E1D" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="textMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.06)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.015)" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6D365" />
      <stop offset="100%" stop-color="#FDA085" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- High-Tech Cyber Grid -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.05)" stroke-width="1" />
      <circle cx="40" cy="0" r="1.2" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>
  </defs>

  <style>
    .font-main { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.04); }
      100% { opacity: 0.6; transform: scale(0.98); }
    }
  </style>

  <!-- Deep Obsidian Canvas -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Luxury Auras -->
  <circle cx="1050" cy="80" r="180" fill="#00F2FE" opacity="0.08" filter="url(#neonGlow)" />
  <circle cx="150" cy="340" r="220" fill="#6366F1" opacity="0.09" filter="url(#neonGlow)" />
  <circle cx="600" cy="180" r="140" fill="#38BDF8" opacity="0.05" filter="url(#neonGlow)" />

  <!-- Cyber Grid Overlay -->
  <rect width="1200" height="400" rx="16" fill="url(#cyberGrid)" />

  <!-- Tech Corner Geometries -->
  <path d="M 24 60 L 24 24 L 60 24" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.7" />
  <path d="M 1176 60 L 1176 24 L 1140 24" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.7" />
  <path d="M 24 340 L 24 376 L 60 376" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.7" />
  <path d="M 1176 340 L 1176 376 L 1140 376" fill="none" stroke="#38BDF8" stroke-width="2.5" opacity="0.7" />

  <!-- Top Status Chip -->
  <g transform="translate(60, 48)">
    <rect width="320" height="34" rx="17" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.2" />
    <circle cx="20" cy="17" r="5" fill="#10B981" filter="url(#subtleGlow)" />
    <text x="36" y="22" fill="#34D399" class="font-mono" font-size="12" font-weight="600" letter-spacing="1">OPEN FOR SDE &amp; FULL-STACK ROLES</text>
  </g>

  <!-- Batch & Location Tag -->
  <g transform="translate(860, 48)">
    <rect width="280" height="34" rx="17" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="140" y="22" fill="#94A3B8" class="font-mono" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.8">📍 BCET DURGAPUR · BATCH 2027</text>
  </g>

  <!-- Main Headline / Identity -->
  <text x="60" y="160" fill="url(#textMetallic)" class="font-main" font-size="64" font-weight="800" letter-spacing="3.5">
    BAPAN GHOSH
  </text>
  
  <!-- Sleek Accent Underline Trace -->
  <path d="M 60 178 L 480 178" stroke="url(#cyanBlueGrad)" stroke-width="4" stroke-linecap="round" filter="url(#subtleGlow)" />
  <circle cx="496" cy="178" r="3" fill="#00F2FE" />
  <path d="M 510 178 L 540 178" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" stroke-linecap="round" />

  <!-- Professional Subtitle -->
  <text x="60" y="218" fill="#38BDF8" class="font-mono" font-size="19" font-weight="600" letter-spacing="1.2">
    Software Development Engineer · Full-Stack &amp; Systems Builder
  </text>
  
  <!-- Refined Bio / Mission Statement -->
  <text x="60" y="250" fill="#94A3B8" class="font-main" font-size="15" font-weight="400" letter-spacing="0.3">
    Building production software with clean architecture, offline-first cryptographic resilience &amp; living room TV engineering.
  </text>

  <!-- Bottom Metric & Flagship Highlights Strip -->
  <g transform="translate(60, 286)">
    <!-- Card 1: Play Store Shipped -->
    <g transform="translate(0, 0)">
      <rect width="255" height="74" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <text x="20" y="30" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">🚀 SHIPPED TO PRODUCTION</text>
      <text x="20" y="54" fill="#FFFFFF" class="font-main" font-size="14" font-weight="600">Rescuen (Play Store)</text>
    </g>

    <!-- Card 2: Fortress UPI -->
    <g transform="translate(275, 0)">
      <rect width="255" height="74" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <text x="20" y="30" fill="#F6D365" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">🛡️ HARDWARE CRYPTO</text>
      <text x="20" y="54" fill="#FFFFFF" class="font-main" font-size="14" font-weight="600">Fortress UPI Protocol</text>
    </g>

    <!-- Card 3: Storyloom Fire TV -->
    <g transform="translate(550, 0)">
      <rect width="255" height="74" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <text x="20" y="30" fill="#A78BFA" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">📺 LIVING ROOM TV &amp; AI</text>
      <text x="20" y="54" fill="#FFFFFF" class="font-main" font-size="14" font-weight="600">Storyloom on Fire TV</text>
    </g>

    <!-- Card 4: Verified Certifications -->
    <g transform="translate(825, 0)">
      <rect width="255" height="74" rx="12" fill="url(#cardGrad)" stroke="url(#cardBorder)" stroke-width="1.2" />
      <text x="20" y="30" fill="#34D399" class="font-mono" font-size="11" font-weight="700" letter-spacing="1">🏆 INDUSTRY CERTIFIED</text>
      <text x="20" y="54" fill="#FFFFFF" class="font-main" font-size="14" font-weight="600">Oracle, Azure &amp; IBM</text>
    </g>
  </g>
</svg>
