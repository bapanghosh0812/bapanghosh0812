<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%" height="24">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background line -->
  <line x1="40" y1="12" x2="960" y2="12" stroke="url(#dividerGrad)" stroke-width="1.5" filter="url(#divGlow)" />
  <!-- Center Jewel / Diamond Node -->
  <g transform="translate(500, 12)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#00F2FE" filter="url(#divGlow)" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
